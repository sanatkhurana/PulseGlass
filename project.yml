name: PulseGlass
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  AnalyticsKit:
    path: AnalyticsKit
targets:
  PulseGlass:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AnalyticsKit
      - target: PulseGlassWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pulseglass
        CODE_SIGN_ENTITLEMENTS: App/PulseGlass.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PulseGlass
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.example.pulseglass
            CFBundleURLSchemes:
              - pulseglass
  PulseGlassWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget/Sources
    dependencies:
      - package: AnalyticsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pulseglass.widget
        CODE_SIGN_ENTITLEMENTS: Widget/PulseGlassWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PulseGlass Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  PulseGlass:
    build:
      targets:
        PulseGlass: all
    run:
      config: Debug
